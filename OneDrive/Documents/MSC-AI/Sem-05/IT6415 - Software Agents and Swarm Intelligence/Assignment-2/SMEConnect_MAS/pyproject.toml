[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smeconnect-ai"
version = "0.1.0"
description = "Local LangGraph multi-agent marketplace assignment starter"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["smeconnect*"]
